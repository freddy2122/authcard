# Déploiement manuel : Actions → Deploy → Run workflow
# Secrets à créer (Settings → Secrets and variables → Actions) :
#   DEPLOY_HOST       — IP ou domaine du serveur
#   DEPLOY_USER       — utilisateur SSH (ex. deploy, ubuntu)
#   DEPLOY_SSH_KEY    — clé privée SSH (contenu complet)
#   DEPLOY_PATH       — chemin du projet sur le serveur (ex. /var/www/authcard)
# Branche déployée : main (adapter reset ci-dessous si vous utilisez master)
#
# Sur le serveur : clone une fois le dépôt, configure .env et droits storage/bootstrap/cache
name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force --no-interaction
            php artisan optimize
            php artisan view:cache
