# CI : tests à chaque push / PR sur main.
# CD : déploiement SSH après tests OK sur push vers main, ou manuel (Actions → CI / CD → Run workflow).
#
# Secrets GitHub (Settings → Secrets and variables → Actions) :
#   DEPLOY_HOST       — IP ou domaine du serveur
#   DEPLOY_USER       — utilisateur SSH (ex. deploy, ubuntu)
#   DEPLOY_SSH_KEY    — clé privée SSH (contenu complet PEM/OpenSSH)
#   DEPLOY_PATH       — chemin absolu du dépôt sur le serveur (ex. /var/www/authcard)
#
# Sur le serveur (une fois) : clone du dépôt, .env, droits storage/bootstrap/cache, PHP 8.1+, Composer.
name: CI / CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo, tokenizer, xml
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Environment & application key
        run: |
          cp .env.example .env
          php artisan key:generate --ansi --force

      - name: Run tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

  deploy:
    needs: tests
    if: |
      needs.tests.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')))
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            BRANCH="${{ github.ref_name }}"
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force --no-interaction
            php artisan storage:link 2>/dev/null || true
            php artisan optimize
            php artisan view:cache
            php artisan queue:restart 2>/dev/null || true
